<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Map Location</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const locations = [
        {
            name: "Lokasi 1",
            lat: -6.859100,
            lng: 107.480485
        },
        {
            name: "Lokasi 2",
            lat: -6.879849,
            lng: 107.459708
        }
    ];

    // Membuat map
    const map = L.map('map');

    // OpenStreetMap
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // Membuat marker
    const markers = [];

    locations.forEach(location => {

        const marker = L.marker([
            location.lat,
            location.lng
        ])
        .addTo(map)
        .bindPopup(`
            <b>${location.name}</b><br>
            Latitude: ${location.lat}<br>
            Longitude: ${location.lng}
        `);

        markers.push(marker);
    });

    // Supaya semua pin terlihat
    const group = L.featureGroup(markers);

    map.fitBounds(
        group.getBounds().pad(0.2)
    );
</script>

</body>
</html>
